<svg xmlns="http://www.w3.org/2000/svg" width="916" height="282" viewBox="0 0 916 282" role="img" aria-labelledby="pr02-diagram-d6c1c14a53e5-title pr02-diagram-d6c1c14a53e5-description">
<title id="pr02-diagram-d6c1c14a53e5-title">2.4 创建会话：createAgentSession 内部做了什么</title>
<desc id="pr02-diagram-d6c1c14a53e5-description">createAgentSession() 内部：
1. 加载 ModelRuntime（读 auth.json / models.json，合并内置 Provider）
2. 初始化 SettingsManager（读 ~/.pi/agent/settings.json，含压缩策略、retry 等）
3. 初始化 SessionManager（默认把会话持久化到 ~/.pi/agent/sessions/&lt;encoded-cwd&gt;/）
4. 加载 DefaultResourceLoader（发现 skills / extensions / AGENTS.md）
5. 创建 Agent 实例，默认启用四个内置工具：read / bash / edit / write</desc>
