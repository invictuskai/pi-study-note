打断 Agent Loop                         toolCallId: &quot;call_abc&quot;,
事件序列不完整，UI 卡死                  toolName: &quot;read&quot;,
content: [{
type: &quot;text&quot;,
text: &quot;ENOENT: no such file or dir&quot;
}],
isError: true
唯一标记
}
追加到对话历史
下一轮发给模型
模型看到后自己决定怎么办</desc>
