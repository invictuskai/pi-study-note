<title id="ch05-diagram-9b18e54fd012-title">异常 → 消息：编码前后对比</title>
<desc id="ch05-diagram-9b18e54fd012-description">工具抛出的原始异常（catch 之前）：        编码后的 ToolResultMessage（catch 之后）：
