<svg xmlns="http://www.w3.org/2000/svg" width="696" height="342" viewBox="0 0 696 342" role="img" aria-labelledby="ch05-diagram-6da60485053d-title ch05-diagram-6da60485053d-description">
<title id="ch05-diagram-6da60485053d-title">Pi 的真实做法：两层错误处理，分层负责</title>
<desc id="ch05-diagram-6da60485053d-description">第一层（工具内部，主动）：识别已知错误类型，包装成具体可读的描述
Read/Edit/Bash 都是这样——Bash 甚至把&quot;已输出的内容&quot;附在错误里
目的：给模型提供&quot;为什么失败、怎么改才对&quot;的具体线索
第二层（框架兜底，被动）：executePreparedToolCall 的 except
只在工具没识别出来时生效
不创造新的错误描述，只把 str(error) 原样透传给模型
目的：保证任何异常都不会穿透到 Agent Loop</desc>
