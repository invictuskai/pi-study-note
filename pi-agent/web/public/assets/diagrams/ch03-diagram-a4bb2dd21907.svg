<text data-row="0" data-column="0" x="28" y="89" textLength="360" lengthAdjust="spacingAndGlyphs" style="white-space:pre">进入下一轮（如果此前有已完成轮次）：</text>
<text data-row="1" data-column="2" x="48" y="119" textLength="150" lengthAdjust="spacingAndGlyphs" style="white-space:pre">prepareNextTurn</text>
