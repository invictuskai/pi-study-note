<svg xmlns="http://www.w3.org/2000/svg" width="626" height="312" viewBox="0 0 626 312" role="img" aria-labelledby="ch03-diagram-a4bb2dd21907-title ch03-diagram-a4bb2dd21907-description">
<title id="ch03-diagram-a4bb2dd21907-title">Turn（一个轮次）</title>
<desc id="ch03-diagram-a4bb2dd21907-description">进入下一轮（如果此前有已完成轮次）：
prepareNextTurn
必要时补取 steering
turn_start
注入准备好的消息和排队消息
prepareRequest
transformContext
convertToLlm
调模型
处理错误或工具调用
finishTurn
turn_end
决定结束，或者检查下一轮输入</desc>
