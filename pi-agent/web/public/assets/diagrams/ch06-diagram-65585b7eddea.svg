<svg xmlns="http://www.w3.org/2000/svg" width="946" height="1182" viewBox="0 0 946 1182" role="img" aria-labelledby="ch06-diagram-65585b7eddea-title ch06-diagram-65585b7eddea-description">
<title id="ch06-diagram-65585b7eddea-title">八、完整数据流：从用户操作到 LLM 看到的消息</title>
<desc id="ch06-diagram-65585b7eddea-description">用户在终端输入 !ls -la
[1] 创建消息
BashExecutionMessage { role: &quot;bashExecution&quot;, command: &quot;ls -la&quot;, output: &quot;...&quot;, ... }
[2] 存入 context.messages: AgentMessage[]
[...原有消息, 新的 BashExecutionMessage]
[3] Agent Loop 准备调用 LLM（第3章讲过的内层循环）
[4] transformContext（可选）
输入/输出都是 AgentMessage[]
裁剪、注入、压缩（第8章详讲 transformContext、第9章详讲 Compaction）
[5] convertToLlm（必须）
AgentMessage[]
Message[]
BashExecutionMessage
UserMessage
excludeFromContext
过滤掉
[6] LLM 收到
llmContext.messages = [
...之前的消息,
{ role: &quot;user&quot;, content: &quot;Ran `ls -la`\n```\n...\n```&quot; }
]
[7] LLM 回复
产生新的 AssistantMessage
可能触发工具调用
ToolResultMessage（第5章的五步管道）
回到 [2]，继续循环</desc>
