<text data-row="0" data-column="0" x="28" y="89" textLength="220" lengthAdjust="spacingAndGlyphs" style="white-space:pre">用户在终端输入 !ls -la</text>
<text data-row="3" data-column="0" x="28" y="179" textLength="120" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[1] 创建消息</text>
<text data-row="4" data-column="4" x="68" y="209" textLength="850" lengthAdjust="spacingAndGlyphs" style="white-space:pre">BashExecutionMessage { role: &quot;bashExecution&quot;, command: &quot;ls -la&quot;, output: &quot;...&quot;, ... }</text>
<text data-row="7" data-column="0" x="28" y="299" textLength="410" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[2] 存入 context.messages: AgentMessage[]</text>
<text data-row="8" data-column="4" x="68" y="329" textLength="400" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[...原有消息, 新的 BashExecutionMessage]</text>
<text data-row="11" data-column="0" x="28" y="419" textLength="500" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[3] Agent Loop 准备调用 LLM（第3章讲过的内层循环）</text>
<text data-row="14" data-column="0" x="28" y="509" textLength="280" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[4] transformContext（可选）</text>
<text data-row="15" data-column="4" x="68" y="539" textLength="280" lengthAdjust="spacingAndGlyphs" style="white-space:pre">输入/输出都是 AgentMessage[]</text>
<text data-row="16" data-column="4" x="68" y="569" textLength="680" lengthAdjust="spacingAndGlyphs" style="white-space:pre">裁剪、注入、压缩（第8章详讲 transformContext、第9章详讲 Compaction）</text>
<text data-row="19" data-column="0" x="28" y="659" textLength="240" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[5] convertToLlm（必须）</text>
<text data-row="20" data-column="4" x="68" y="689" textLength="140" lengthAdjust="spacingAndGlyphs" style="white-space:pre">AgentMessage[]</text>
<text data-row="20" data-column="21" x="238" y="689" textLength="90" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Message[]</text>
<text data-row="21" data-column="4" x="68" y="719" textLength="200" lengthAdjust="spacingAndGlyphs" style="white-space:pre">BashExecutionMessage</text>
<text data-row="21" data-column="27" x="298" y="719" textLength="110" lengthAdjust="spacingAndGlyphs" style="white-space:pre">UserMessage</text>
<text data-row="22" data-column="4" x="68" y="749" textLength="180" lengthAdjust="spacingAndGlyphs" style="white-space:pre">excludeFromContext</text>
<text data-row="22" data-column="25" x="278" y="749" textLength="60" lengthAdjust="spacingAndGlyphs" style="white-space:pre">过滤掉</text>
<text data-row="25" data-column="0" x="28" y="839" textLength="120" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[6] LLM 收到</text>
<text data-row="26" data-column="4" x="68" y="869" textLength="230" lengthAdjust="spacingAndGlyphs" style="white-space:pre">llmContext.messages = [</text>
<text data-row="27" data-column="8" x="108" y="899" textLength="140" lengthAdjust="spacingAndGlyphs" style="white-space:pre">...之前的消息,</text>
<text data-row="28" data-column="8" x="108" y="929" textLength="560" lengthAdjust="spacingAndGlyphs" style="white-space:pre">{ role: &quot;user&quot;, content: &quot;Ran `ls -la`\n```\n...\n```&quot; }</text>
<text data-row="29" data-column="4" x="68" y="959" textLength="10" lengthAdjust="spacingAndGlyphs" style="white-space:pre">]</text>
<text data-row="32" data-column="0" x="28" y="1049" textLength="120" lengthAdjust="spacingAndGlyphs" style="white-space:pre">[7] LLM 回复</text>
<text data-row="33" data-column="6" x="88" y="1079" textLength="250" lengthAdjust="spacingAndGlyphs" style="white-space:pre">产生新的 AssistantMessage</text>
<text data-row="34" data-column="6" x="88" y="1109" textLength="160" lengthAdjust="spacingAndGlyphs" style="white-space:pre">可能触发工具调用</text>
<text data-row="34" data-column="25" x="278" y="1109" textLength="360" lengthAdjust="spacingAndGlyphs" style="white-space:pre">ToolResultMessage（第5章的五步管道）</text>
<text data-row="35" data-column="6" x="88" y="1139" textLength="180" lengthAdjust="spacingAndGlyphs" style="white-space:pre">回到 [2]，继续循环</text>
