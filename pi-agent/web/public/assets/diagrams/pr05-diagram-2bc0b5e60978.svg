<title id="pr05-diagram-2bc0b5e60978-title">首先：框架兜底，不会崩</title>
<desc id="pr05-diagram-2bc0b5e60978-description">execute 里 throw new Error(&quot;连接超时&quot;)
框架捕获，转成结果：{ content: &quot;连接超时&quot;, isError: true }
当作正常的工具结果发给 LLM
LLM 看到「连接超时」，决定下一步怎么办</desc>
