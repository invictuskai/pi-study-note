<svg xmlns="http://www.w3.org/2000/svg" width="806" height="552" viewBox="0 0 806 552" role="img" aria-labelledby="ch06-diagram-49fe5c5db31e-title ch06-diagram-49fe5c5db31e-description">
<title id="ch06-diagram-49fe5c5db31e-title">翻译发生在什么时候？</title>
<desc id="ch06-diagram-49fe5c5db31e-description">每次 LLM 调用前的消息处理管道：
context.messages: AgentMessage[]
Agent 内部的消息（最多 7 种类型）
[1] transformContext (可选)
AgentMessage[]
AgentMessage[]
裁剪旧消息、注入外部上下文
[2] convertToLlm (必须)
AgentMessage[]
Message[]
自定义消息翻译成标准格式
llmContext.messages: Message[]
LLM 看到的消息（只有 3 种类型）
streamFunction(model, llmContext, ...)
调用 LLM（第4章讲过）</desc>
