<title id="ch07-diagram-1628cfa71c51-title">2.1 事件源：10 种 AgentEvent</title>
<desc id="ch07-diagram-1628cfa71c51-description">Agent 运行
agent_start
Agent 开始
Turn 1（第3章讲过：一次模型调用 + 它触发的工具执行）
turn_start
Turn 开始
Message（LLM 的响应）
message_start
message_update ×N
流式增量（逐 token 更新）
message_end
Tool Execution（工具执行）
tool_execution_start
tool_execution_update ×N  工具进度（如 Bash 的输出）
tool_execution_end
turn_end
Turn 结束
Turn 2 ...
agent_end
Agent 结束</desc>
