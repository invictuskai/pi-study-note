<text data-row="0" data-column="0" x="28" y="89" textLength="100" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Agent 运行</text>
<text data-row="1" data-column="4" x="68" y="119" textLength="110" lengthAdjust="spacingAndGlyphs" style="white-space:pre">agent_start</text>
<text data-row="1" data-column="38" x="408" y="119" textLength="100" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Agent 开始</text>
<text data-row="3" data-column="4" x="68" y="179" textLength="520" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Turn 1（第3章讲过：一次模型调用 + 它触发的工具执行）</text>
<text data-row="4" data-column="8" x="108" y="209" textLength="100" lengthAdjust="spacingAndGlyphs" style="white-space:pre">turn_start</text>
<text data-row="4" data-column="38" x="408" y="209" textLength="90" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Turn 开始</text>
<text data-row="6" data-column="8" x="108" y="269" textLength="210" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Message（LLM 的响应）</text>
<text data-row="7" data-column="12" x="148" y="299" textLength="130" lengthAdjust="spacingAndGlyphs" style="white-space:pre">message_start</text>
<text data-row="8" data-column="12" x="148" y="329" textLength="170" lengthAdjust="spacingAndGlyphs" style="white-space:pre">message_update ×N</text>
<text data-row="8" data-column="37" x="398" y="329" textLength="250" lengthAdjust="spacingAndGlyphs" style="white-space:pre">流式增量（逐 token 更新）</text>
<text data-row="9" data-column="12" x="148" y="359" textLength="110" lengthAdjust="spacingAndGlyphs" style="white-space:pre">message_end</text>
<text data-row="11" data-column="8" x="108" y="419" textLength="260" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Tool Execution（工具执行）</text>
<text data-row="12" data-column="12" x="148" y="449" textLength="200" lengthAdjust="spacingAndGlyphs" style="white-space:pre">tool_execution_start</text>
<text data-row="13" data-column="12" x="148" y="479" textLength="520" lengthAdjust="spacingAndGlyphs" style="white-space:pre">tool_execution_update ×N  工具进度（如 Bash 的输出）</text>
<text data-row="14" data-column="12" x="148" y="509" textLength="180" lengthAdjust="spacingAndGlyphs" style="white-space:pre">tool_execution_end</text>
