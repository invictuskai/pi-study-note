<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Loop：模型结果、工具与队列共同决定续跑</title>
<style>
body { margin: 2rem; background: #faf7f2; color: #1c1917; font-family: system-ui, sans-serif; }
main { max-width: 1080px; margin: auto; }
svg { width: 100%; height: auto; }
p { line-height: 1.7; }
</style>
</head>
<body><main>
<h1>Agent Loop：是否还要调用一次模型？</h1>
<p>依据 pi 提交 898ab804 的 runLoop。stopReason 不是唯一开关；运行结束也不证明任务已正确完成。</p>
<svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop 续跑判断</title>
  <desc id="desc">先处理 error 或 aborted 的硬退出。其他回复根据实际工具块处理，length 拒绝执行工具并返回错误。finishTurn 可强制结束；否则工具、steering、follow-up 或显式 continue 可触发下一轮。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#57534e"/></marker></defs>
  <rect width="1000" height="840" fill="#faf7f2"/>
  <g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1c1917">
    <rect x="50" y="20" width="540" height="50" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="51">一次模型调用返回 AssistantMessage</text>
    <path d="M320 70 V100" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <rect x="50" y="105" width="540" height="50" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="136">stopReason 是 error / aborted？</text>
    <path d="M590 130 H645" fill="none" stroke="#b5523a" marker-end="url(#arrow)"/>
    <text x="615" y="118">是</text>
    <rect x="650" y="95" width="320" height="95" rx="8" fill="#f7e7e1" stroke="#b5523a"/>
    <text x="810" y="121">finishTurn 收尾，忽略调度决定</text>
    <text x="810" y="147">turn_end → agent_end → return</text>
    <text x="810" y="173">不执行工具，不检查任何队列</text>
    <path d="M320 155 V190" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="341" y="178">否</text>
    <rect x="50" y="195" width="540" height="115" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="223">从 content 提取实际 toolCall</text>
    <text x="320" y="248">没有调用：hasMoreToolCalls = false</text>
    <text x="320" y="273">有调用且 length：不执行，生成错误结果，标志 = true</text>
    <text x="320" y="298">有调用且未截断：执行批次，标志 = !batch.terminate</text>
    <rect x="650" y="215" width="320" height="85" rx="8" fill="#f7e7e1" stroke="#b5523a"/>
    <text x="810" y="241">batch.terminate：</text>
    <text x="810" y="264">非空批次的全部最终结果为 true</text>
    <text x="810" y="287">仅取消工具触发的自动续跑</text>
    <path d="M320 310 V340" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <rect x="50" y="345" width="540" height="55" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="367">finishTurn → turn_end</text>
    <text x="320" y="389">决定为 end？</text>
    <path d="M590 374 H645" fill="none" stroke="#b5523a" marker-end="url(#arrow)"/>
    <text x="615" y="361">是</text>
    <rect x="650" y="345" width="320" height="60" rx="8" fill="#f7e7e1" stroke="#b5523a"/>
    <text x="810" y="370">agent_end → return</text><text x="810" y="392">不检查队列</text>
    <path d="M320 400 V440" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="341" y="425">否</text>
    <rect x="50" y="445" width="540" height="50" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="476">工具要求续跑，或取到 steering？</text>
    <path d="M590 470 H790 V590" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="620" y="458">是</text>
    <path d="M320 495 V530" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="350" y="518">否</text>
    <rect x="50" y="535" width="540" height="50" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="566">退出内层，取到 follow-up？</text>
    <path d="M590 560 H740 V590" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="620" y="548">是</text>
    <path d="M320 585 V625" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="350" y="609">否</text>
    <rect x="50" y="630" width="540" height="50" rx="8" fill="white" stroke="#57534e"/>
    <text x="320" y="661">finishTurn 的 continue 决定尚未被满足？</text>
    <path d="M590 655 H645" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="615" y="643">是</text>
    <rect x="650" y="595" width="320" height="110" rx="8" fill="#e6f1e8" stroke="#2d6e3c"/>
    <text x="810" y="622">选定下一 Turn</text>
    <text x="810" y="649">多个续跑理由只触发一轮</text>
    <text x="810" y="676">prepareNextTurn → turn_start</text>
    <text x="810" y="697">注入输入 → prepareRequest → 调模型</text>
    <path d="M320 680 V730" fill="none" stroke="#57534e" marker-end="url(#arrow)"/>
    <text x="350" y="711">否</text>
    <rect x="50" y="735" width="540" height="50" rx="8" fill="white" stroke="#b5523a"/>
    <text x="320" y="766">break 外层 → agent_end</text>
    <text x="500" y="822" fill="#57534e">结束运行 ≠ 任务验收成功；terminate ≠ return；退出内层 ≠ 退出整个函数</text>
  </g>
</svg>
</main></body>
</html>
