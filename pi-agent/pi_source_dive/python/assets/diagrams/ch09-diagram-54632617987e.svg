<title id="ch09-diagram-54632617987e-title">七、完整链路回顾</title>
<desc id="ch09-diagram-54632617987e-description">① 触发判断
shouldCompact()
contextTokens(185K) &gt; contextWindow(200K) - reserve(16K)
红灯亮起，开始压缩
② 找切割点
向后遍历
累积 token 到 keepRecent(20K)
找最近的有效切割点
排除 ToolResult 后的位置
保证消息对完整
③ 分割消息
切割点之前
messagesToSummarize（被压缩）
切割点之后
kept（保留）
④ 生成摘要
序列化消息为文本
调 LLM 填写 6 section 结构化摘要
传入 previousSummary 做增量更新
合并文件跟踪列表
⑤ 存储结果
CompactionEntry 追加到 Session Tree
⑥ 下次运行时
buildSessionContext()
用 CompactionSummaryMessage 替换旧消息
convertToLlm
摘要翻译成 UserMessage 发给 LLM</desc>
