<svg xmlns="http://www.w3.org/2000/svg" width="726" height="282" viewBox="0 0 726 282" role="img" aria-labelledby="ch03-diagram-f73513965ed1-title ch03-diagram-f73513965ed1-description">
<title id="ch03-diagram-f73513965ed1-title">4.6 executeToolCalls()：并行与串行</title>
<desc id="ch03-diagram-f73513965ed1-description">串行：A 预检
执行
after hook
工具结束及结果消息
B ...
并行：
1. 按调用顺序预检；拦截/校验失败的项当场生成结束结果
2. 允许执行的项并发执行、运行 after hook、发送 tool_execution_end
3. 等待本批处理完成，按原始调用顺序发送 toolResult 消息</desc>
