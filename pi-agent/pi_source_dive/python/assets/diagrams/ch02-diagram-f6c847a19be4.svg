<text data-row="0" data-column="0" x="28" y="89" textLength="410" lengthAdjust="spacingAndGlyphs" style="white-space:pre">Before（pi-ai 层）：Tool 只知道&quot;长什么样&quot;</text>
<text data-row="2" data-column="0" x="28" y="149" textLength="250" lengthAdjust="spacingAndGlyphs" style="white-space:pre">interface Tool&lt;TSchema&gt; {</text>
<text data-row="3" data-column="4" x="68" y="179" textLength="120" lengthAdjust="spacingAndGlyphs" style="white-space:pre">name: string</text>
<text data-row="4" data-column="4" x="68" y="209" textLength="190" lengthAdjust="spacingAndGlyphs" style="white-space:pre">description: string</text>
<text data-row="5" data-column="4" x="68" y="239" textLength="190" lengthAdjust="spacingAndGlyphs" style="white-space:pre">parameters: TSchema</text>
<text data-row="6" data-column="0" x="28" y="269" textLength="10" lengthAdjust="spacingAndGlyphs" style="white-space:pre">}</text>
<text data-row="8" data-column="11" x="138" y="329" textLength="150" lengthAdjust="spacingAndGlyphs" style="white-space:pre">agent-core 扩展</text>
<text data-row="10" data-column="0" x="28" y="389" textLength="510" lengthAdjust="spacingAndGlyphs" style="white-space:pre">After（pi-agent-core 层）：AgentTool 知道&quot;怎么执行&quot;</text>
<text data-row="12" data-column="0" x="28" y="449" textLength="520" lengthAdjust="spacingAndGlyphs" style="white-space:pre">interface AgentTool&lt;TSchema&gt; extends Tool&lt;TSchema&gt; {</text>
<text data-row="13" data-column="4" x="68" y="479" textLength="130" lengthAdjust="spacingAndGlyphs" style="white-space:pre">label: string</text>
<text data-row="13" data-column="49" x="518" y="479" textLength="40" lengthAdjust="spacingAndGlyphs" style="white-space:pre">新增</text>
<text data-row="14" data-column="4" x="68" y="509" textLength="420" lengthAdjust="spacingAndGlyphs" style="white-space:pre">execute: (...) =&gt; Promise&lt;AgentToolResult&gt;</text>
<text data-row="14" data-column="49" x="518" y="509" textLength="40" lengthAdjust="spacingAndGlyphs" style="white-space:pre">新增</text>
<text data-row="15" data-column="4" x="68" y="539" textLength="410" lengthAdjust="spacingAndGlyphs" style="white-space:pre">executionMode?: &quot;sequential&quot; | &quot;parallel&quot;</text>
<text data-row="15" data-column="49" x="518" y="539" textLength="40" lengthAdjust="spacingAndGlyphs" style="white-space:pre">新增</text>
<text data-row="16" data-column="0" x="28" y="569" textLength="10" lengthAdjust="spacingAndGlyphs" style="white-space:pre">}</text>
<text data-row="18" data-column="11" x="138" y="629" textLength="170" lengthAdjust="spacingAndGlyphs" style="white-space:pre">coding-agent 扩展</text>
<text data-row="20" data-column="0" x="28" y="689" textLength="580" lengthAdjust="spacingAndGlyphs" style="white-space:pre">After（pi-coding-agent 层）：ToolDefinition 加上&quot;怎么显示&quot;</text>
<text data-row="22" data-column="0" x="28" y="749" textLength="260" lengthAdjust="spacingAndGlyphs" style="white-space:pre">interface ToolDefinition {</text>
<text data-row="23" data-column="4" x="68" y="779" textLength="280" lengthAdjust="spacingAndGlyphs" style="white-space:pre">// 继承 AgentTool 的全部字段</text>
<text data-row="24" data-column="4" x="68" y="809" textLength="310" lengthAdjust="spacingAndGlyphs" style="white-space:pre">// + 渲染器、权限控制等业务属性</text>
<text data-row="25" data-column="0" x="28" y="839" textLength="10" lengthAdjust="spacingAndGlyphs" style="white-space:pre">}</text>
</g>
