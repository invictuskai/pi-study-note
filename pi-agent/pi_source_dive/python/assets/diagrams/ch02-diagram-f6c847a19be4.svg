<title id="ch02-diagram-f6c847a19be4-title">类型扩展的 Before → After 对照</title>
<desc id="ch02-diagram-f6c847a19be4-description">Before（pi-ai 层）：Tool 只知道&quot;长什么样&quot;
interface Tool&lt;TSchema&gt; {
name: string
description: string
parameters: TSchema
}
agent-core 扩展
After（pi-agent-core 层）：AgentTool 知道&quot;怎么执行&quot;
interface AgentTool&lt;TSchema&gt; extends Tool&lt;TSchema&gt; {
label: string
新增
execute: (...) =&gt; Promise&lt;AgentToolResult&gt;
新增
executionMode?: &quot;sequential&quot; | &quot;parallel&quot;
新增
}
coding-agent 扩展
After（pi-coding-agent 层）：ToolDefinition 加上&quot;怎么显示&quot;
interface ToolDefinition {
// 继承 AgentTool 的全部字段
// + 渲染器、权限控制等业务属性
}</desc>
