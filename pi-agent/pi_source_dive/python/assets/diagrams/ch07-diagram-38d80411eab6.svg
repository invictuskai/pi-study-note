<text data-row="2" data-column="6" x="88" y="149" textLength="270" lengthAdjust="spacingAndGlyphs" style="white-space:pre">管道 B：tool_call（执行前）</text>
<text data-row="3" data-column="7" x="98" y="179" textLength="640" lengthAdjust="spacingAndGlyphs" style="white-space:pre">扩展可以 return {&quot;block&quot;: True} 拦掉它；一旦 block，下面都不发生</text>
<text data-row="4" data-column="7" x="98" y="209" textLength="760" lengthAdjust="spacingAndGlyphs" style="white-space:pre">注意：tool_call 不是 2.1 那 10 种之一，是 SDK 在执行前主动触发的扩展独占事件</text>
