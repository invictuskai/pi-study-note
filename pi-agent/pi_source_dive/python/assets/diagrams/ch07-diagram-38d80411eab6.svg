<svg xmlns="http://www.w3.org/2000/svg" width="886" height="462" viewBox="0 0 886 462" role="img" aria-labelledby="ch07-diagram-38d80411eab6-title ch07-diagram-38d80411eab6-description">
<title id="ch07-diagram-38d80411eab6-title">2.2 两条管道：subscribe 与扩展 pi.on</title>
<desc id="ch07-diagram-38d80411eab6-description">LLM 决定调一个工具
管道 B：tool_call（执行前）
扩展可以 return {&quot;block&quot;: True} 拦掉它；一旦 block，下面都不发生
注意：tool_call 不是 2.1 那 10 种之一，是 SDK 在执行前主动触发的扩展独占事件
（没被拦）tool.execute() 开跑
管道 A + B 都收到：tool_execution_start（已开跑，拦不住了）
这是 2.1 那 10 种之一，由 Agent 内核发出，两条管道都收
tool_execution_end</desc>
