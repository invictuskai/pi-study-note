<svg xmlns="http://www.w3.org/2000/svg" width="786" height="672" viewBox="0 0 786 672" role="img" aria-labelledby="ch05-diagram-9a8a8afe30e0-title ch05-diagram-9a8a8afe30e0-description">
<title id="ch05-diagram-9a8a8afe30e0-title">并行执行的三阶段设计</title>
<desc id="ch05-diagram-9a8a8afe30e0-description">阶段 1 - 准备（顺序执行）：
ToolCall 1: emit_start
prepareArguments
validate
beforeToolCall
ToolCall 2: emit_start
prepareArguments
validate
beforeToolCall
ToolCall 3: emit_start
prepareArguments
validate
beforeToolCall
// 准备阶段必须顺序，因为 beforeToolCall 可能有副作用（如修改全局状态）
阶段 2 - 执行（并行）：
ToolCall 1: execute
ToolCall 2: execute
Promise.all
ToolCall 3: execute
// 只有 tool.execute() 并行
阶段 3 - 事件发送（有序）：
ToolCall 2: emit_end
先完成的先发 tool_execution_end
ToolCall 1: emit_end
ToolCall 3: emit_end
ToolCall 1: emit_result
但 ToolResultMessage 按调用顺序发
ToolCall 2: emit_result
ToolCall 3: emit_result</desc>
