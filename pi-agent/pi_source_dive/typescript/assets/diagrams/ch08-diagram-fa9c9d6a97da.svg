<svg xmlns="http://www.w3.org/2000/svg" width="706" height="312" viewBox="0 0 706 312" role="img" aria-labelledby="ch08-diagram-fa9c9d6a97da-title ch08-diagram-fa9c9d6a97da-description">
<title id="ch08-diagram-fa9c9d6a97da-title">LCA 算法：找&quot;分叉点&quot;</title>
<desc id="ch08-diagram-fa9c9d6a97da-description">旧路径：root
...
leaf_1
新路径：root
...
leaf_2
1. 把两条路径都拿出来
2. 在新路径上从后往前找，第一个也在旧路径里的节点 = LCA（分叉点）
3. 从 leaf_1 向上爬到 LCA（不含 LCA），沿途收集的内容
就是&quot;被放弃的分支&quot;</desc>
