Skills 列表（每个 skill 一段描述）
工具定义（每个工具的 JSON schema）
对话历史（每一轮 user / assistant / toolResult）
用户输入
LLM 回复（含 thinking、toolCall）
工具结果（read 文件、bash 输出、grep 命中……）
当前轮的新输入</desc>
