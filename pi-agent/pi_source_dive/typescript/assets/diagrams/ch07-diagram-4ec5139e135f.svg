<title id="ch07-diagram-4ec5139e135f-title">发布-订阅 vs 直接调用</title>
<desc id="ch07-diagram-4ec5139e135f-description">直接调用（打电话）：
Agent
调用
终端渲染
调用
文件存储
调用
日志记录
Agent 需要知道所有消费者的存在，每加一个新功能就要改 Agent
发布-订阅（广播）：
Agent
emit事件
📡 事件总线
终端渲染（订阅了）
文件存储（订阅了）
日志记录（订阅了）
（新功能只需订阅，Agent 不需要知道）</desc>
