<title id="ch09-diagram-84c5904c6a03-title">一个关键时序：压缩发生在两轮对话之间</title>
<desc id="ch09-diagram-84c5904c6a03-description">用户问
Agent 回答
(Agent 这一轮结束，发 agent_end 事件)
检查 token：超阈值了吗？
没超
等下一轮       超了
立刻压缩
找切割点
生成摘要
把 CompactionEntry 写进 Session Tree
下一轮用户开始问时：
buildSessionContext() 从 Session Tree 重建上下文
CompactionSummaryMessage 替代旧消息
LLM 看到的是&quot;摘要 + 近期消息&quot;</desc>
